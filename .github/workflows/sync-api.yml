name: 同步 API 参考翻译

on:
  schedule:
    # 北京时间每天 06:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git operations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 抓取并翻译 API 页面
        run: npm run fetch-api

      - name: 检查是否有变更
        id: check
        run: |
          if ! git diff --quiet -- 'docs/api/namespaces/' 'scripts/api-translations.json'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      - name: 提交翻译更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/namespaces/ scripts/api-translations.json
          git commit -m "chore: 自动同步 API 翻译 $(date +'%Y-%m-%d')"
          git push
